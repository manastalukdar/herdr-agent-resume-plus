name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: node mods/agent-resume-plus/plan.test.mjs
      - run: python3 -I mods/agent-resume-plus/agent_session.py --test
      - run: python3 -m py_compile scripts/install.py
